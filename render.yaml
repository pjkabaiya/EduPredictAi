services:
  - type: web
    name: mathpredict-ai-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r server/requirements.txt
    startCommand: cd server && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: mathpredict_ai
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
